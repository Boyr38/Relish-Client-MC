name: Build Relish Client

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Build mod jar
        shell: cmd
        run: gradlew.bat build --no-daemon

      - name: Stage jar for the installer
        shell: pwsh
        run: |
          $jar = Get-ChildItem build/libs/relishclient-*.jar | Where-Object { $_.Name -notlike '*sources*' } | Select-Object -First 1
          if (-not $jar) { throw "Mod jar not found in build/libs" }
          Copy-Item $jar.FullName installer/relishclient.jar

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer exe
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\relish.iss'

      - uses: actions/upload-artifact@v4
        with:
          name: RelishClient-Setup
          path: installer/output/RelishClient-Setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: relishclient-jar
          path: installer/relishclient.jar

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installer/output/RelishClient-Setup.exe
            installer/relishclient.jar
